[project]
name = "diligence-agents"
version = "0.1.0"
description = "Multi-agent vendor due diligence with LangGraph: plan, parallel research, analysis, and a critic loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md Faisal Islam", email = "faisalislam1610@gmail.com" }]
dependencies = ["pydantic>=2.6", "langgraph>=0.3"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
ui = ["streamlit>=1.33"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
diligence = "diligence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
